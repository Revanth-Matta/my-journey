<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" fill="#2a231c" rx="64"/>

  <!-- Main Outer Compass Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#e8a33d" stroke-width="24"/>
  
  <!-- Inner Framing Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#e8a33d" stroke-width="12"/>

  <!-- Compass Points (Points Group) -->
  <g fill="#e8a33d">
    <!-- North -->
    <polygon points="256,40 274,90 256,76"/>
    <polygon points="256,40 238,90 256,76" fill="#f3ede2"/>
    
    <!-- South -->
    <polygon points="256,472 238,422 256,436"/>
    <polygon points="256,472 274,422 256,436" fill="#f3ede2"/>
    
    <!-- East -->
    <polygon points="472,256 422,238 436,256"/>
    <polygon points="472,256 422,274 436,256" fill="#f3ede2"/>
    
    <!-- West -->
    <polygon points="40,256 90,274 76,256"/>
    <polygon points="40,256 90,238 76,256" fill="#f3ede2"/>
    
    <!-- Northeast -->
    <polygon points="408.5,103.5 362.5,135.3 378.1,119.7"/>
    <polygon points="408.5,103.5 376.7,149.5 378.1,119.7" fill="#f3ede2"/>
    
    <!-- Northwest -->
    <polygon points="103.5,103.5 135.3,149.5 119.7,138.1"/>
    <polygon points="103.5,103.5 149.5,135.3 119.7,138.1" fill="#f3ede2"/>
    
    <!-- Southeast -->
    <polygon points="408.5,408.5 376.7,362.5 378.1,392.3"/>
    <polygon points="408.5,408.5 362.5,376.7 378.1,392.3" fill="#f3ede2"/>
    
    <!-- Southwest -->
    <polygon points="103.5,408.5 149.5,376.7 138.1,392.3"/>
    <polygon points="103.5,408.5 135.3,362.5 138.1,392.3" fill="#f3ede2"/>
  </g>

  <!-- Central Silhouette background mask for clarity -->
  <circle cx="256" cy="256" r="70" fill="#2a231c"/>

  <!-- Sailing Ship Silhouette -->
  <g fill="#e8a33d" transform="translate(196, 196)">
    <!-- Hull -->
    <path d="M 12 76 C 30 92, 90 92, 108 76 C 114 70, 116 64, 116 64 L 4 64 C 4 64, 6 70, 12 76 Z"/>
    <path d="M 4 64 L 116 64 L 110 56 L 10 56 Z"/>
    
    <!-- Main Mast & Center Sails -->
    <rect x="56" y="8" width="8" height="52"/>
    <path d="M 64 12 C 84 18, 84 48, 64 52 C 76 35, 76 25, 64 12 Z"/>
    <path d="M 56 12 C 36 18, 36 48, 56 52 C 44 35, 44 25, 56 12 Z" fill="#f3ede2"/>
    
    <!-- Fore Mast & Sails (Left) -->
    <rect x="28" y="24" width="6" height="36"/>
    <path d="M 28 26 C 12 30, 12 52, 28 56 C 18 42, 18 36, 28 26 Z" fill="#f3ede2"/>
    
    <!-- Mizzen Mast & Sails (Right) -->
    <rect x="86" y="28" width="6" height="32"/>
    <path d="M 92 30 C 106 34, 106 52, 92 56 C 100 44, 100 38, 92 30 Z"/>
  </g>
</svg>
